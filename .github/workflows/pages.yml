name: GitHub Pages へデプロイ

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Build CSS
        run: yarn build:css

      - name: Build static site with Perron
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy
        run: bin/rails perron:build

      # プロジェクトサイトは https://maangie.github.io/gunyuuden/ 配下で
      # 配信されるため、ルート絶対パスにリポジトリ名を前置する
      - name: Rewrite root-relative paths for subdirectory hosting
        run: |
          find output -name '*.html' -print0 | xargs -0 sed -i -E \
            -e 's@(href|src)="/([^/"])@\1="/gunyuuden/\2@g' \
            -e 's@(href|src)="/"@\1="/gunyuuden/"@g'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
